name: Update changelog on merge

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add merged pull request to changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-changelog.py "$GITHUB_EVENT_PATH" CHANGELOG.md

      - name: Commit changelog update
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already contains this pull request."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for PR #${PR_NUMBER}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            git fetch origin main
            git switch --detach origin/main
            python3 .github/scripts/update-changelog.py "$GITHUB_EVENT_PATH" CHANGELOG.md
            if git diff --quiet -- CHANGELOG.md; then
              echo "Changelog already contains this pull request."
              exit 0
            fi
            git add CHANGELOG.md
            git commit -m "docs: update changelog for PR #${PR_NUMBER}"
          done
