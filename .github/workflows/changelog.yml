name: Update changelog on merge

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

concurrency:
  group: changelog-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'automation/changelog'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add merged pull request to changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-changelog.py "$GITHUB_EVENT_PATH" CHANGELOG.md

      - name: Create changelog pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/changelog
          delete-branch: true
          commit-message: "docs: update changelog for PR #${{ github.event.pull_request.number }}"
          title: "docs: update changelog for PR #${{ github.event.pull_request.number }}"
          body: "Automatically records the merged pull request in CHANGELOG.md."
