name: Nightly changelog catch-up

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: changelog-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add recent merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-nightly-changelog.py CHANGELOG.md

      - name: Create changelog pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/changelog
          delete-branch: true
          commit-message: "docs: nightly changelog update"
          title: "docs: update changelog (nightly catch-up)"
          body: "Automatically adds recently merged pull requests and direct commits to main missing from CHANGELOG.md."
